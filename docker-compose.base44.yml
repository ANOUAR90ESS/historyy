services:
  dependencies:
    image: node:24-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["sh", "-ec", "npm ci --no-audit --no-fund"]

  api:
    image: node:24-bookworm-slim
    restart: on-failure
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - app_data:/data
    env_file:
      - path: /run/base44/app.env
        required: false
    environment:
      PORT: 3001
      APP_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      DATABASE_PATH: /data/forma.sqlite
      MEDIA_PATH: /data/media
    command: ["sh", "-ec", "exec npm run dev:server"]
    depends_on:
      dependencies:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/session',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)process.exit(1);return r.json()}).then(j=>{if(!('user' in j))process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: node:24-bookworm-slim
    restart: on-failure
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - API_PROXY_TARGET=http://api:3001
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
    command: ["sh", "-ec", "exec npm run dev"]
    depends_on:
      dependencies:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([fetch('http://localhost:3000/',{signal:AbortSignal.timeout(3000)}).then(async r=>{if(!r.ok||!(await r.text()).includes('/src/main.jsx'))throw Error('Frontend failed')}),fetch('http://localhost:3000/api/session',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)throw Error('API proxy failed')})]).catch(e=>{console.error(e.message);process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  node_modules:
  app_data:
